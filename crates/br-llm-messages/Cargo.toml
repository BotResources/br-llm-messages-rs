[package]
name = "br-llm-messages"
version = "1.0.0"
description = "Provider-neutral Rust model of an LLM conversation: turns, entries, content blocks, streaming drafts, storage records and perspective projection"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", default-features = false, features = ["std"] }
