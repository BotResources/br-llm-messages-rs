[package]
name = "br-llm-messages"
version = "0.0.0"
description = "Provider-neutral Rust model of an LLM conversation: messages, content blocks, thinking replay, tool calls and results"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/BotResources/br-llm-messages-rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
